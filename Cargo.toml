[workspace]
resolver = "2"
members = ["solutions/year=*", "cli", "runtime", "evaluator/fixtures"]

[workspace.dependencies]
aoc-runtime = { path = "runtime" }
hashbrown = "0.16.1"
petgraph = { version = "0.8.3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
